
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assign Teacher | SmartLMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{common/navbar :: navbar}"></div>

<div class="dashboard-wrapper">

    <div th:replace="~{common/sidebar :: sidebar}"></div>

    <main class="main-content">

        <div class="mb-4">
            <h2 class="fw-bold">Teacher-Course Assignment</h2>
            <p class="text-muted">
                Assign courses to teachers.
            </p>
        </div>

        <!-- Messages -->
        <div th:if="${success}"
             class="alert alert-success"
             th:text="${success}">
        </div>

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <!-- Assignment Form -->
        <div class="card border-0 shadow-sm">

            <div class="card-body p-4">

                <h5 class="fw-bold mb-4">Assign New Course</h5>

                <form th:action="@{/admin/assignments/assign}"
                      method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <!-- Select Teacher -->
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Select Teacher
                        </label>

                        <select name="teacherId"
                                class="form-select"
                                required>

                            <option value="">Choose Teacher</option>

                            <option th:each="teacher : ${teachers}"
                                    th:value="${teacher.id}"
                                    th:text="${teacher.name + ' (' + teacher.email + ')'}">
                            </option>

                        </select>

                    </div>

                    <!-- Select Course -->
                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            Select Course
                        </label>

                        <select name="courseId"
                                class="form-select"
                                required>

                            <option value="">Choose Course</option>

                            <option th:each="course : ${courses}"
                                    th:value="${course.id}"
                                    th:text="${course.title}">
                            </option>

                        </select>

                    </div>

                    <button type="submit" class="btn btn-primary px-4">
                        Assign Course
                    </button>

                    <a th:href="@{/admin/courses}"
                       class="btn btn-outline-secondary ms-2">
                        Back to Courses
                    </a>

                </form>

            </div>
        </div>

    </main>

</div>

<div th:replace="~{common/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
