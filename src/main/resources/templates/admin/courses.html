
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Courses | SmartLMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{common/navbar :: navbar}"></div>

<div class="dashboard-wrapper">

    <div th:replace="~{common/sidebar :: sidebar}"></div>

    <main class="main-content">

        <!-- Page Heading -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h2 class="fw-bold">Manage Courses</h2>
                <p class="text-muted mb-0">
                    Create and manage all learning courses.
                </p>
            </div>

            <a th:href="@{/admin/courses/create}" class="btn btn-primary">
                + Add New Course
            </a>
        </div>

        <!-- Success and Error Messages -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Statistics -->
        <div class="row g-3 mb-4">

            <div class="col-md-4">
                <div class="card dashboard-card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="text-muted">Total Courses</h6>
                        <h3 class="fw-bold" th:text="${totalCourses}">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card dashboard-card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="text-muted">Published Courses</h6>
                        <h3 class="fw-bold text-success"
                            th:text="${publishedCourses}">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card dashboard-card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="text-muted">Draft Courses</h6>
                        <h3 class="fw-bold text-warning"
                            th:text="${draftCourses}">0</h3>
                    </div>
                </div>
            </div>

        </div>

        <!-- Search and Filter -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-6">
                        <input type="text"
                               id="searchInput"
                               class="form-control"
                               placeholder="Search course by title...">
                    </div>

                    <div class="col-md-3">
                        <select id="categoryFilter" class="form-select">
                            <option value="">All Categories</option>
                            <option value="Programming">Programming</option>
                            <option value="Web Development">Web Development</option>
                            <option value="Cyber Security">Cyber Security</option>
                            <option value="Database">Database</option>
                            <option value="Data Science">Data Science</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <select id="statusFilter" class="form-select">
                            <option value="">All Status</option>
                            <option value="Published">Published</option>
                            <option value="Draft">Draft</option>
                        </select>
                    </div>

                </div>

            </div>
        </div>

        <!-- Course Table -->
        <div class="card border-0 shadow-sm">
            <div class="card-body">

                <h5 class="fw-bold mb-3">Course List</h5>

                <div class="table-responsive">

                    <table class="table table-hover align-middle" id="courseTable">

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Course Title</th>
                                <th>Category</th>
                                <th>Duration</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="course : ${courses}"
                                th:attr="data-title=${course.title},
                                         data-category=${course.category},
                                         data-status=${course.active ? 'Published' : 'Draft'}">

                                <td th:text="${course.id}"></td>

                                <td>
                                    <strong th:text="${course.title}"></strong>
                                    <div class="text-muted small"
                                         th:text="${course.description}">
                                    </div>
                                </td>

                                <td th:text="${course.category}"></td>

                                <td th:text="${course.duration}"></td>

                                <td>
                                    ₹<span th:text="${course.price != null ? course.price : 0}"></span>
                                </td>

                                <td>
                                    <span th:if="${course.active}"
                                          class="badge bg-success">
                                        Published
                                    </span>

                                    <span th:unless="${course.active}"
                                          class="badge bg-warning text-dark">
                                        Draft
                                    </span>
                                </td>

                                <td>
                                    <div class="d-flex gap-2">

                                        <!-- Edit -->
                                        <a th:href="@{/admin/courses/edit/{id}(id=${course.id})}"
                                           class="btn btn-sm btn-outline-primary">
                                            Edit
                                        </a>

                                        <!-- Enable / Disable -->
                                        <form th:action="@{/admin/courses/status/{id}(id=${course.id})}"
                                              method="post">

                                            <input type="hidden"
                                                   th:name="${_csrf.parameterName}"
                                                   th:value="${_csrf.token}">

                                            <input type="hidden"
                                                   name="active"
                                                   th:value="${!course.active}">

                                            <button type="submit"
                                                    class="btn btn-sm btn-outline-warning"
                                                    th:text="${course.active ? 'Disable' : 'Publish'}">
                                            </button>

                                        </form>

                                        <!-- Delete -->
                                        <form th:action="@{/admin/courses/delete/{id}(id=${course.id})}"
                                              method="post"
                                              onsubmit="return confirm('Are you sure you want to delete this course?');">

                                            <input type="hidden"
                                                   th:name="${_csrf.parameterName}"
                                                   th:value="${_csrf.token}">

                                            <button type="submit"
                                                    class="btn btn-sm btn-outline-danger">
                                                Delete
                                            </button>

                                        </form>

                                    </div>
                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(courses)}">
                                <td colspan="7" class="text-center text-muted py-4">
                                    No courses available. Click Add New Course to create one.
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>
            </div>
        </div>

    </main>

</div>

<div th:replace="~{common/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Search and Filter JavaScript -->
<script>
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const statusFilter = document.getElementById("statusFilter");

    function filterCourses() {

        const search = searchInput.value.toLowerCase();
        const category = categoryFilter.value.toLowerCase();
        const status = statusFilter.value.toLowerCase();

        const rows = document.querySelectorAll("#courseTable tbody tr[data-title]");

        rows.forEach(row => {

            const title = row.dataset.title.toLowerCase();
            const rowCategory = (row.dataset.category || "").toLowerCase();
            const rowStatus = row.dataset.status.toLowerCase();

            const matchesSearch = title.includes(search);
            const matchesCategory = category === "" || rowCategory === category;
            const matchesStatus = status === "" || rowStatus.toLowerCase() === status;

            row.style.display =
                matchesSearch && matchesCategory && matchesStatus ? "" : "none";
        });
    }

    searchInput.addEventListener("input", filterCourses);
    categoryFilter.addEventListener("change", filterCourses);
    statusFilter.addEventListener("change", filterCourses);
</script>

</body>
</html>
