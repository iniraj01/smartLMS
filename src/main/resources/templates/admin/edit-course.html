
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course | SmartLMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{common/navbar :: navbar}"></div>

<div class="dashboard-wrapper">

    <div th:replace="~{common/sidebar :: sidebar}"></div>

    <main class="main-content">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold">Edit Course</h2>
                <p class="text-muted">Update course information.</p>
            </div>

            <a th:href="@{/admin/courses}" class="btn btn-secondary">
                Back to Courses
            </a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/admin/courses/edit/{id}(id=${course.id})}"
                      th:object="${course}"
                      method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Course Title *</label>
                        <input type="text"
                               th:field="*{title}"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea th:field="*{description}"
                                  class="form-control"
                                  rows="4"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Category</label>
                            <select th:field="*{category}" class="form-select" required>
                                <option value="Programming">Programming</option>
                                <option value="Web Development">Web Development</option>
                                <option value="Database">Database</option>
                                <option value="Cyber Security">Cyber Security</option>
                                <option value="Data Science">Data Science</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Duration</label>
                            <input type="text"
                                   th:field="*{duration}"
                                   class="form-control">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Course Price (₹)</label>
                        <input type="number"
                               th:field="*{price}"
                               class="form-control"
                               min="0"
                               step="0.01">
                    </div>

                    <button type="submit" class="btn btn-primary px-4">
                        Update Course
                    </button>

                    <a th:href="@{/admin/courses}"
                       class="btn btn-outline-secondary ms-2">
                        Cancel
                    </a>

                </form>
            </div>
        </div>

    </main>
</div>

</body>
</html>
