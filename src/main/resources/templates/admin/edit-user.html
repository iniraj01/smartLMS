
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit User | SmartLMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .form-card {
            max-width: 850px;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,.05);
        }

        .form-control {
            padding: 11px;
            border-radius: 8px;
        }

        .form-label {
            font-weight: 600;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<div th:replace="~{common/navbar :: navbar}"></div>

<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div th:replace="~{common/sidebar :: sidebar}"></div>

    <main class="main-content">

        <div class="mb-4">
            <h2 class="fw-bold">Edit User</h2>
            <p class="text-muted">Update user account information.</p>
        </div>

        <div class="form-card">

            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>

            <h5 class="fw-bold mb-4">User Information</h5>

            <form th:action="@{/admin/users/edit/{id}(id=${user.id})}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text"
                               name="name"
                               class="form-control"
                               th:value="${user.name}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email Address</label>
                        <input type="email"
                               name="email"
                               class="form-control"
                               th:value="${user.email}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input type="tel"
                               name="phone"
                               class="form-control"
                               th:value="${user.phone}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Role</label>
                        <input type="text"
                               class="form-control"
                               th:value="${user.role}"
                               readonly>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">
                            New Password
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               minlength="8"
                               maxlength="72"
                               placeholder="Leave blank to keep existing password">

                        <small class="text-muted">
                            Enter a new password only if you want to change it.
                        </small>
                    </div>

                </div>

                <div class="mt-4 d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary px-4">
                        Update User
                    </button>

                    <a th:href="@{/admin/users}"
                       class="btn btn-outline-secondary px-4">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
