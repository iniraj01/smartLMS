
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin Settings | SmartLMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="d-flex">

        <div th:replace="~{common/sidebar :: sidebar}"></div>

        <main class="main-content">

            <div class="mb-4">
                <h2 class="fw-bold">Admin Settings</h2>
                <p class="text-muted">
                    Manage your account and platform preferences.
                </p>
            </div>

            <!-- General Settings -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">

                    <h5 class="fw-bold mb-4">General Settings</h5>

                    <form>

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label">Platform Name</label>
                                <input type="text" class="form-control"
                                       value="SmartLMS">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Support Email</label>
                                <input type="email" class="form-control"
                                       value="support@smartlms.com">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Contact Number</label>
                                <input type="text" class="form-control"
                                       placeholder="Enter contact number">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Platform Website</label>
                                <input type="text" class="form-control"
                                       value="www.smartlms.com">
                            </div>

                        </div>

                        <button type="button" class="btn btn-primary mt-4">
                            Save General Settings
                        </button>

                    </form>

                </div>
            </div>

            <!-- Security Settings -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">

                    <h5 class="fw-bold mb-4">Security Settings</h5>

                    <form>

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label">Current Password</label>
                                <input type="password" class="form-control"
                                       placeholder="Enter current password">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">New Password</label>
                                <input type="password" class="form-control"
                                       placeholder="Enter new password">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-control"
                                       placeholder="Confirm new password">
                            </div>

                        </div>

                        <button type="button" class="btn btn-primary mt-4">
                            Update Password
                        </button>

                    </form>

                </div>
            </div>

            <!-- Notification Settings -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">

                    <h5 class="fw-bold mb-4">Notification Settings</h5>

                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox"
                               id="emailNotification" checked>
                        <label class="form-check-label"
                               for="emailNotification">
                            Enable Email Notifications
                        </label>
                    </div>

                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox"
                               id="registrationNotification" checked>
                        <label class="form-check-label"
                               for="registrationNotification">
                            New Student Registration Alerts
                        </label>
                    </div>

                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox"
                               id="courseNotification">
                        <label class="form-check-label"
                               for="courseNotification">
                            New Course Notifications
                        </label>
                    </div>

                </div>
            </div>

            <!-- Platform Settings -->
            <div class="card border-0 shadow-sm">
                <div class="card-body">

                    <h5 class="fw-bold mb-4">Platform Settings</h5>

                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox"
                               id="registration" checked>
                        <label class="form-check-label" for="registration">
                            Allow Student Registration
                        </label>
                    </div>

                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox"
                               id="approval" checked>
                        <label class="form-check-label" for="approval">
                            Require Admin Approval for New Courses
                        </label>
                    </div>

                    <button type="button" class="btn btn-primary mt-3">
                        Save Platform Settings
                    </button>

                </div>
            </div>

        </main>

    </div>

    <div th:replace="~{common/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
