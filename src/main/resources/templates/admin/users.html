
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | SmartLMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .user-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,.05);
        }

        .role-badge {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .role-student {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .role-teacher {
            background: #dcfce7;
            color: #15803d;
        }

        .role-admin {
            background: #f3e8ff;
            color: #7e22ce;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: #dbeafe;
            color: #2563eb;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 8px;
        }

        .table td {
            vertical-align: middle;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<div th:replace="~{common/navbar :: navbar}"></div>

<div class="dashboard-wrapper">

    <!-- Sidebar -->
    <div th:replace="~{common/sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <main class="main-content">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h2 class="fw-bold">User Management</h2>
                <p class="text-muted">Manage all SmartLMS users.</p>
            </div>

            <a th:href="@{/admin/users/create}" class="btn btn-primary">
                + Add New User
            </a>
        </div>

        <!-- Messages -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Statistics -->
        <div class="row g-3 mb-4">

            <div class="col-md-4">
                <div class="user-card">
                    <p class="text-muted">Total Users</p>
                    <h3 th:text="${#lists.size(users)}">0</h3>
                </div>
            </div>

            <div class="col-md-4">
                <div class="user-card">
                    <p class="text-muted">Students</p>
                    <h3 class="text-primary"
                        th:text="${#lists.size(users.?[role.name() == 'STUDENT'])}">0</h3>
                </div>
            </div>

            <div class="col-md-4">
                <div class="user-card">
                    <p class="text-muted">Teachers</p>
                    <h3 class="text-success"
                        th:text="${#lists.size(users.?[role.name() == 'TEACHER'])}">0</h3>
                </div>
            </div>

        </div>

        <!-- User Table -->
        <div class="user-card">

            <div class="row g-3 mb-3">

                <div class="col-md-6">
                    <input type="text" id="searchInput"
                           class="form-control"
                           placeholder="Search name or email...">
                </div>

                <div class="col-md-3">
                    <select id="roleFilter" class="form-select">
                        <option value="">All Roles</option>
                        <option value="STUDENT">Student</option>
                        <option value="TEACHER">Teacher</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <select id="statusFilter" class="form-select">
                        <option value="">All Status</option>
                        <option value="Active">Active</option>
                        <option value="Disabled">Disabled</option>
                    </select>
                </div>

            </div>

            <div class="table-responsive">

                <table class="table table-hover" id="usersTable">

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>User</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="user : ${users}">

                        <td th:text="${user.id}"></td>

                        <td>
                            <span class="user-avatar"
                                  th:text="${#strings.substring(user.name,0,1).toUpperCase()}">U</span>
                            <span th:text="${user.name}"></span>
                        </td>

                        <td th:text="${user.email}"></td>

                        <td th:text="${user.phone != null ? user.phone : '-'}"></td>

                        <td>
                            <span class="role-badge"
                                  th:classappend="${user.role.name() == 'STUDENT' ? ' role-student' : (user.role.name() == 'TEACHER' ? ' role-teacher' : ' role-admin')}"
                                  th:text="${user.role}">
                            </span>
                        </td>

                        <td>
                            <span th:if="${user.enabled}" class="badge bg-success">Active</span>
                            <span th:unless="${user.enabled}" class="badge bg-danger">Disabled</span>
                        </td>

						<td>
						    <div class="d-flex gap-2">

						        <!-- Enable / Disable Button -->
						        <form th:if="${user.role.name() != 'ADMIN'}"
						              th:action="@{/admin/users/status/{id}(id=${user.id})}"
						              method="post">

						            <input type="hidden"
						                   th:name="${_csrf.parameterName}"
						                   th:value="${_csrf.token}">

						            <input type="hidden"
						                   name="enabled"
						                   th:value="${!user.enabled}">

						            <button type="submit"
						                    class="btn btn-sm btn-outline-warning"
						                    th:text="${user.enabled ? 'Disable' : 'Enable'}">
						            </button>
						        </form>

						        <!-- Edit Button -->
						        <a th:if="${user.role.name() != 'ADMIN'}"
						           th:href="@{/admin/users/edit/{id}(id=${user.id})}"
						           class="btn btn-sm btn-outline-primary">
						            Edit
						        </a>

						        <!-- Delete Button -->
						        <form th:if="${user.role.name() != 'ADMIN'}"
						              th:action="@{/admin/users/delete/{id}(id=${user.id})}"
						              method="post">

						            <input type="hidden"
						                   th:name="${_csrf.parameterName}"
						                   th:value="${_csrf.token}">

						            <button type="submit"
						                    class="btn btn-sm btn-outline-danger"
						                    onclick="return confirm('Are you sure you want to delete this user?')">
						                Delete
						            </button>
						        </form>

						    </div>
						</td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="7" class="text-center py-4">
                            No users found.
                        </td>
                    </tr>

                    </tbody>
                </table>

                <p id="noResults" class="text-center text-muted d-none">
                    No matching users found.
                </p>

            </div>
        </div>

    </main>

</div>

<script>
    const searchInput = document.getElementById("searchInput");
    const roleFilter = document.getElementById("roleFilter");
    const statusFilter = document.getElementById("statusFilter");

    function filterUsers() {

        const search = searchInput.value.toLowerCase();
        const role = roleFilter.value;
        const status = statusFilter.value;

        const rows = document.querySelectorAll("#usersTable tbody tr");
        let count = 0;

        rows.forEach(row => {

            if (row.cells.length < 7) return;

            const name = row.cells[1].innerText.toLowerCase();
            const email = row.cells[2].innerText.toLowerCase();
            const userRole = row.cells[4].innerText.trim();
            const userStatus = row.cells[5].innerText.trim();

            const visible =
                (name.includes(search) || email.includes(search)) &&
                (!role || userRole === role) &&
                (!status || userStatus === status);

            row.style.display = visible ? "" : "none";

            if (visible) count++;
        });

        document.getElementById("noResults")
            .classList.toggle("d-none", count > 0);
    }

    searchInput.addEventListener("input", filterUsers);
    roleFilter.addEventListener("change", filterUsers);
    statusFilter.addEventListener("change", filterUsers);
</script>

</body>
</html>
