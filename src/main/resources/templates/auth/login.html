
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SmartLMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e40af);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #fff;
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,.2);
        }

        .brand {
            color: #2563eb;
            font-size: 28px;
            font-weight: 800;
            text-align: center;
        }

        .subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-control {
            padding: 12px;
            border-radius: 9px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 9px;
            font-weight: 600;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .bottom-text {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
        }

        .bottom-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="brand">SmartLMS</div>
    <p class="subtitle">Welcome back! Login to continue.</p>

    <div th:if="${param.error}" class="alert alert-danger">
        Invalid email or password.
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        You have been logged out successfully.
    </div>

    <div th:if="${param.registered}" class="alert alert-success">
        Registration successful! Please login.
    </div>

    <form th:action="@{/login}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email"
                   class="form-control"
                   name="username"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>

            <div class="input-group">
                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       required>

                <button class="btn btn-outline-secondary"
                        type="button"
                        onclick="togglePassword()">
                    Show
                </button>
            </div>
        </div>

        <div class="d-flex justify-content-between mb-4">
            <div class="form-check">
                <input class="form-check-input"
                       type="checkbox"
                       name="remember-me"
                       id="remember">
                <label class="form-check-label" for="remember">
                    Remember me
                </label>
            </div>

            <a href="#" class="text-decoration-none small">
                Forgot Password?
            </a>
        </div>

        <button type="submit" class="login-btn">
            Login to Dashboard
        </button>

    </form>

    <div class="bottom-text">
        Don't have an account?
        <a th:href="@{/register}">Create Account</a>
    </div>

    <div class="text-center mt-3">
        <a th:href="@{/}" class="text-muted small text-decoration-none">
            ← Back to Home
        </a>
    </div>

</div>

<script>
    function togglePassword() {
        const password = document.getElementById("password");

        password.type = password.type === "password"
            ? "text"
            : "password";
    }
</script>

</body>
</html>
