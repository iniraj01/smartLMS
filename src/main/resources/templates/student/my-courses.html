
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Courses | SmartLMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="dashboard-wrapper">

        <!-- Common Student Sidebar -->
        <div th:replace="~{common/student-sidebar :: studentSidebar('my-courses')}"></div>

        <!-- Main Content -->
        <main class="main-content">

            <div class="mb-4">
                <h2 class="fw-bold">My Courses</h2>
                <p class="text-muted">
                    Continue learning with your enrolled courses.
                </p>
            </div>

            <!-- Course Statistics -->
            <div class="row g-3 mb-4">

                <div class="col-md-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <p class="text-muted mb-1">Enrolled Courses</p>
                            <h3 class="fw-bold"
                                th:text="${totalCourses}">0</h3>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Course Cards -->
            <div class="row g-4">

                <div class="col-lg-6 col-xl-4"
                     th:each="enrollment : ${enrollments}">

                    <div class="card border-0 shadow-sm h-100">

                        <div class="card-body d-flex flex-column">

                            <span class="badge bg-success align-self-start mb-3">
                                Enrolled
                            </span>

                            <h5 class="fw-bold"
                                th:text="${enrollment.course.title}">
                                Course Title
                            </h5>

                            <p class="text-muted"
                               th:text="${enrollment.course.description}">
                                Course Description
                            </p>

                            <div class="mb-2">
                                <small class="text-muted">Category: </small>
                                <strong th:text="${enrollment.course.category}">
                                    Category
                                </strong>
                            </div>

                            <div class="mb-3">
                                <small class="text-muted">Duration: </small>
                                <strong th:text="${enrollment.course.duration}">
                                    Duration
                                </strong>
                            </div>

                            <div class="mt-auto">
                                <a th:href="@{/student/course/{id}/lessons(id=${enrollment.course.id})}"
                                   class="btn btn-primary w-100">
                                    Start Learning
                                </a>
                            </div>

                        </div>
                    </div>

                </div>

                <!-- Empty State -->
                <div class="col-12"
                     th:if="${#lists.isEmpty(enrollments)}">

                    <div class="card border-0 shadow-sm">
                        <div class="card-body text-center py-5">

                            <h5 class="fw-bold">No Enrolled Courses Yet</h5>

                            <p class="text-muted">
                                Explore available courses and start learning.
                            </p>

                            <a href="/student/available-courses"
                               class="btn btn-primary">
                                Explore Courses
                            </a>

                        </div>
                    </div>

                </div>

            </div>

        </main>

    </div>

    <div th:replace="~{common/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
