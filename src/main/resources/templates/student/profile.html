
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | SmartLMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .dashboard-wrapper {
            display: flex;
            width: 100%;
            min-height: calc(100vh - 65px);
        }

        .student-sidebar {
            flex: 0 0 250px;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 25px;
        }

        .profile-card {
            border: none;
            border-radius: 12px;
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            font-weight: 700;
            margin: auto;
        }

        .profile-label {
            font-size: 13px;
            color: #64748b;
        }

        @media(max-width: 768px) {
            .dashboard-wrapper {
                flex-direction: column;
            }

            .student-sidebar {
                width: 100%;
                flex-basis: auto;
            }

            .main-content {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="dashboard-wrapper">

        <!-- Common Student Sidebar -->
        <div th:replace="~{common/student-sidebar :: studentSidebar('profile')}"></div>

        <!-- Main Content -->
        <main class="main-content">

            <div class="mb-4">
                <h2>My Profile</h2>
                <p class="text-muted">
                    Manage your personal and academic information.
                </p>
            </div>

            <div class="row g-4">

                <!-- Profile Information -->
                <div class="col-lg-4">

                    <div class="card profile-card shadow-sm p-4 text-center">

                        <div class="profile-avatar">
                            ST
                        </div>

                        <h5 class="mt-3">Student Name</h5>

                        <p class="text-muted mb-1">
                            student@example.com
                        </p>

                        <span class="badge bg-primary mt-2">
                            Student Account
                        </span>

                        <hr>

                        <div class="text-start">

                            <p class="mb-2">
                                <span class="profile-label">Student ID</span><br>
                                <strong>STU2026001</strong>
                            </p>

                            <p class="mb-2">
                                <span class="profile-label">Enrollment Date</span><br>
                                <strong>01 September 2026</strong>
                            </p>

                            <p class="mb-0">
                                <span class="profile-label">Account Status</span><br>
                                <span class="badge bg-success">Active</span>
                            </p>

                        </div>

                    </div>

                </div>

                <!-- Profile Form -->
                <div class="col-lg-8">

                    <div class="card profile-card shadow-sm p-4">

                        <h5 class="mb-4">Personal Information</h5>

                        <form id="profileForm">

                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label class="form-label">Full Name</label>
                                    <input type="text"
                                           class="form-control"
                                           value="Student Name"
                                           required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Email Address</label>
                                    <input type="email"
                                           class="form-control"
                                           value="student@example.com"
                                           required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Phone Number</label>
                                    <input type="tel"
                                           class="form-control"
                                           value="9876543210">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Date of Birth</label>
                                    <input type="date"
                                           class="form-control">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Gender</label>
                                    <select class="form-select">
                                        <option value="">Select Gender</option>
                                        <option>Male</option>
                                        <option>Female</option>
                                        <option>Other</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Qualification</label>
                                    <input type="text"
                                           class="form-control"
                                           value="Graduation">
                                </div>

                                <div class="col-12">
                                    <label class="form-label">Address</label>
                                    <textarea class="form-control"
                                              rows="3"
                                              placeholder="Enter your address"></textarea>
                                </div>

                                <div class="col-12">
                                    <button type="submit"
                                            class="btn btn-primary">
                                        Save Changes
                                    </button>
                                </div>

                            </div>

                            <div id="profileMessage" class="mt-3"></div>

                        </form>

                    </div>

                    <!-- Change Password -->
                    <div class="card profile-card shadow-sm p-4 mt-4">

                        <h5 class="mb-4">Change Password</h5>

                        <form id="passwordForm">

                            <div class="mb-3">
                                <label class="form-label">Current Password</label>
                                <input type="password"
                                       class="form-control"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">New Password</label>
                                <input type="password"
                                       class="form-control"
                                       minlength="8"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Confirm New Password</label>
                                <input type="password"
                                       class="form-control"
                                       minlength="8"
                                       required>
                            </div>

                            <button type="submit"
                                    class="btn btn-outline-primary">
                                Update Password
                            </button>

                            <div id="passwordMessage" class="mt-3"></div>

                        </form>

                    </div>

                </div>

            </div>

        </main>

    </div>

    <!-- Footer -->
    <div th:replace="~{common/footer :: footer}"></div>

    <script>

        const profileForm = document.getElementById("profileForm");
        const passwordForm = document.getElementById("passwordForm");

        profileForm.addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("profileMessage").innerHTML =
                '<div class="alert alert-info">' +
                'Demo only: Profile update will work after backend integration.' +
                '</div>';
        });

        passwordForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const passwords = this.querySelectorAll('input[type="password"]');

            const currentPassword = passwords[0].value;
            const newPassword = passwords[1].value;
            const confirmPassword = passwords[2].value;

            const message = document.getElementById("passwordMessage");

            if (newPassword !== confirmPassword) {
                message.innerHTML =
                    '<div class="alert alert-danger">' +
                    'New password and confirm password do not match.' +
                    '</div>';
                return;
            }

            if (currentPassword === newPassword) {
                message.innerHTML =
                    '<div class="alert alert-warning">' +
                    'New password must be different from current password.' +
                    '</div>';
                return;
            }

            message.innerHTML =
                '<div class="alert alert-info">' +
                'Demo only: Password update will work after backend integration.' +
                '</div>';
        });

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
