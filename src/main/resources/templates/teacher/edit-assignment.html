
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Assignment | SmartLMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{common/navbar :: navbar}"></div>

<div class="d-flex">

    <!-- Teacher Sidebar -->
    <aside class="sidebar teacher-sidebar">

        <div class="sidebar-heading">
            <h5>TEACHER PANEL</h5>
        </div>

        <ul class="sidebar-menu">
            <li><a href="/teacher/dashboard"><span>🏠</span> Dashboard</a></li>
            <li><a href="/teacher/courses"><span>📚</span> My Courses</a></li>
            <li><a href="/teacher/lessons"><span>📖</span> Manage Lessons</a></li>
            <li><a href="/teacher/assignments" class="active"><span>📝</span> Assignments</a></li>
            <li><a href="/teacher/submissions"><span>📥</span> Submissions</a></li>
            <li><a href="/teacher/attendance"><span>📅</span> Attendance</a></li>
            <li><a href="/teacher/profile"><span>👤</span> My Profile</a></li>
        </ul>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <div class="mb-4">
            <h2 class="fw-bold">Edit Assignment</h2>
            <p class="text-muted">
                Update your assignment details.
            </p>
        </div>

        <div class="card border-0 shadow-sm">

            <div class="card-body p-4">

                <form th:action="@{/teacher/assignments/update/{id}(id=${assignment.id})}"
                      method="post">

                    <!-- CSRF Token -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <!-- Assignment Title -->
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Assignment Title
                        </label>

                        <input type="text"
                               name="title"
                               class="form-control"
                               th:value="${assignment.title}"
                               maxlength="255"
                               required>

                    </div>

                    <!-- Course Information -->
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Course
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${assignment.course.title}"
                               readonly>

                        <small class="text-muted">
                            Course cannot be changed while editing.
                        </small>

                    </div>

                    <!-- Description -->
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Description
                        </label>

                        <textarea name="description"
                                  class="form-control"
                                  rows="5"
                                  maxlength="2000"
                                  th:text="${assignment.description}"
                                  placeholder="Enter assignment instructions...">
                        </textarea>

                    </div>

                    <!-- Due Date and Marks -->
                    <div class="row g-3">

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Due Date
                            </label>

                            <input type="date"
                                   name="dueDate"
                                   class="form-control"
                                   th:value="${assignment.dueDate}"
                                   required>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label fw-semibold">
                                Maximum Marks
                            </label>

                            <input type="number"
                                   name="totalMarks"
                                   class="form-control"
                                   th:value="${assignment.totalMarks}"
                                   min="1"
                                   step="0.5"
                                   required>

                        </div>

                    </div>

                    <!-- Current Status -->
                    <div class="mt-3">

                        <label class="form-label fw-semibold">
                            Current Status
                        </label>

                        <div>
                            <span th:if="${assignment.active}"
                                  class="badge bg-success">
                                Published
                            </span>

                            <span th:unless="${assignment.active}"
                                  class="badge bg-secondary">
                                Unpublished
                            </span>
                        </div>

                    </div>

                    <!-- Buttons -->
                    <div class="d-flex gap-2 mt-4">

                        <button type="submit"
                                class="btn btn-primary">
                            Update Assignment
                        </button>

                        <a th:href="@{/teacher/assignments}"
                           class="btn btn-outline-secondary">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>

</div>

<div th:replace="~{common/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
