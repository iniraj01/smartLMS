
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Lesson | SmartLMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="d-flex">

        <!-- Teacher Sidebar -->
        <aside class="sidebar teacher-sidebar">
            <div class="sidebar-heading">
                <h5>TEACHER PANEL</h5>
            </div>

            <ul class="sidebar-menu">
                <li><a href="/teacher/dashboard"><span>📊</span> Dashboard</a></li>
                <li><a href="/teacher/courses"><span>📚</span> My Courses</a></li>
                <li><a href="/teacher/lessons" class="active"><span>🎥</span> Manage Lessons</a></li>
                <li><a href="/teacher/assignments"><span>📝</span> Assignments</a></li>
                <li><a href="/teacher/submissions"><span>📩</span> Submissions</a></li>
                <li><a href="/teacher/attendance"><span>📅</span> Attendance</a></li>
                <li><a href="/teacher/profile"><span>👤</span> My Profile</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <div class="mb-4">
                <h2 class="fw-bold">Edit Lesson</h2>
                <p class="text-muted">
                    Update your lesson information.
                </p>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <form th:action="@{/teacher/lessons/edit/{id}(id=${lesson.id})}"
                          method="post">

                        <input type="hidden"
                               name="courseId"
                               th:value="${courseId}">

                        <!-- Lesson Title -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Lesson Title
                            </label>

                            <input type="text"
                                   class="form-control"
                                   name="title"
                                   th:value="${lesson.title}"
                                   required>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Lesson Description
                            </label>

                            <textarea class="form-control"
                                      name="description"
                                      rows="4"
                                      required
                                      th:text="${lesson.description}">
                            </textarea>
                        </div>

                        <!-- Video URL -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Video URL
                            </label>

                            <input type="url"
                                   class="form-control"
                                   name="videoUrl"
                                   th:value="${lesson.videoUrl}"
                                   placeholder="Enter video URL">
                        </div>

                        <!-- Lesson Order -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Lesson Order
                            </label>

                            <input type="number"
                                   class="form-control"
                                   name="lessonOrder"
                                   min="1"
                                   th:value="${lesson.lessonOrder}"
                                   required>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-primary">
                                Update Lesson
                            </button>

                            <a th:href="@{/teacher/lessons/course/{id}(id=${courseId})}"
                               class="btn btn-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </main>
    </div>

    <div th:replace="~{common/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
