
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Exam Management | SmartLMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- Navbar -->
    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="dashboard-wrapper">

        <!-- Common Teacher Sidebar -->
        <div th:replace="~{common/teacher-sidebar :: teacherSidebar('exams')}"></div>

        <!-- Main Content -->
        <main class="main-content">

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h2 class="fw-bold">Exam Management</h2>
                    <p class="text-muted mb-0">
                        Create and manage your course examinations.
                    </p>
                </div>
            </div>

            <!-- Messages -->
            <div th:if="${successMessage}"
                 class="alert alert-success"
                 th:text="${successMessage}">
            </div>

            <div th:if="${errorMessage}"
                 class="alert alert-danger"
                 th:text="${errorMessage}">
            </div>

            <!-- Create Exam -->
            <div class="card border-0 shadow-sm mb-4">

                <div class="card-body p-4">

                    <h5 class="fw-bold mb-3">
                        <span class="text-primary">+</span>
                        Create Final Examination
                    </h5>

                    <form th:action="@{/teacher/exams/create}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <div class="row g-3">

                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Select Course
                                </label>

                                <select name="courseId"
                                        class="form-select"
                                        required>

                                    <option value="">Choose Course</option>

                                    <option th:each="course : ${courses}"
                                            th:value="${course.id}"
                                            th:text="${course.title}">
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Exam Title
                                </label>

                                <input type="text"
                                       name="title"
                                       class="form-control"
                                       placeholder="e.g. Java Final Examination"
                                       required>

                            </div>

                            <div class="col-12">

                                <label class="form-label fw-semibold">
                                    Description
                                </label>

                                <textarea name="description"
                                          class="form-control"
                                          rows="2"
                                          placeholder="Enter exam instructions"></textarea>

                            </div>

                            <div class="col-md-3">

                                <label class="form-label fw-semibold">
                                    Total Marks
                                </label>

                                <input type="number"
                                       name="totalMarks"
                                       class="form-control"
                                       value="100"
                                       min="1"
                                       step="0.5"
                                       required>

                            </div>

                            <div class="col-md-3">

                                <label class="form-label fw-semibold">
                                    Passing Percentage
                                </label>

                                <input type="number"
                                       name="passingPercentage"
                                       class="form-control"
                                       value="40"
                                       min="1"
                                       max="100"
                                       step="0.5"
                                       required>

                            </div>

                            <div class="col-md-3">

                                <label class="form-label fw-semibold">
                                    Duration (Minutes)
                                </label>

                                <input type="number"
                                       name="durationMinutes"
                                       class="form-control"
                                       value="30"
                                       min="1"
                                       required>

                            </div>

                            <div class="col-md-3">

                                <label class="form-label fw-semibold">
                                    Maximum Attempts
                                </label>

                                <input type="number"
                                       name="maxAttempts"
                                       class="form-control"
                                       value="3"
                                       min="1"
                                       max="3"
                                       required>

                            </div>

                            <div class="col-12">

                                <button type="submit"
                                        class="btn btn-primary px-4">
                                    Create Examination
                                </button>

                            </div>

                        </div>

                    </form>

                </div>
            </div>

            <!-- Exam List -->
            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <h5 class="fw-bold mb-3">My Examinations</h5>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead>
                                <tr>
                                    <th>Exam Title</th>
                                    <th>Course</th>
                                    <th>Total Marks</th>
                                    <th>Passing %</th>
                                    <th>Attempts</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>

                            <tbody>

                                <tr th:each="exam : ${exams}">

                                    <td>
                                        <strong th:text="${exam.title}">
                                            Exam Title
                                        </strong>
                                    </td>

                                    <td th:text="${exam.course.title}">
                                        Course
                                    </td>

                                    <td th:text="${exam.totalMarks}">
                                        100
                                    </td>

                                    <td th:text="${exam.passingPercentage} + '%'">
                                        40%
                                    </td>

                                    <td th:text="${exam.maxAttempts}">
                                        3
                                    </td>

                                    <td>

                                        <span th:if="${exam.active}"
                                              class="badge bg-success">
                                            Published
                                        </span>

                                        <span th:unless="${exam.active}"
                                              class="badge bg-warning text-dark">
                                            Draft
                                        </span>

                                    </td>

                                    <td>
                                        <div class="d-flex flex-wrap gap-2">

                                            <a th:href="@{/teacher/exams/{id}/questions(id=${exam.id})}"
                                               class="btn btn-sm btn-primary">
                                                Manage Questions
                                            </a>

                                            <a th:href="@{/teacher/exams/{id}/results(id=${exam.id})}"
                                               class="btn btn-sm btn-outline-success">
                                                View Results
                                            </a>

                                        </div>
                                    </td>

                                </tr>

                                <!-- Empty State -->
                                <tr th:if="${#lists.isEmpty(exams)}">

                                    <td colspan="7"
                                        class="text-center text-muted py-4">
                                        No examinations created yet.
                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>
            </div>

        </main>

    </div>

    <!-- Footer -->
    <div th:replace="~{common/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
