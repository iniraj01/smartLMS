
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Lessons | SmartLMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- Navbar -->
    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="d-flex">

        <!-- Common Teacher Sidebar -->
        <div th:replace="~{common/teacher-sidebar :: teacherSidebar('lessons')}"></div>

        <!-- Main Content -->
        <main class="main-content flex-grow-1">

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                <div>
                    <h2 class="fw-bold">Manage Lessons</h2>
                    <p class="text-muted mb-0">
                        Create and organize lessons for your assigned courses.
                    </p>
                </div>

                <button class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#addLessonModal"
                        th:disabled="${#lists.isEmpty(courses)}">
                    + Add New Lesson
                </button>
            </div>

            <!-- Success Message -->
            <div th:if="${successMessage}"
                 class="alert alert-success alert-dismissible fade show">
                <span th:text="${successMessage}"></span>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"></button>
            </div>

            <!-- Error Message -->
            <div th:if="${errorMessage}"
                 class="alert alert-danger alert-dismissible fade show">
                <span th:text="${errorMessage}"></span>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"></button>
            </div>

            <!-- Course Filter -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">

                    <label class="form-label fw-semibold">Select Course</label>

                    <select class="form-select"
                            id="courseFilter"
                            onchange="if(this.value) window.location.href='/teacher/lessons/course/' + this.value">

                        <option value="">Select a course</option>

                        <option th:each="course : ${courses}"
                                th:value="${course.id}"
                                th:text="${course.title}"
                                th:selected="${course.id == selectedCourseId}">
                        </option>

                    </select>

                </div>
            </div>

            <!-- Lesson List -->
            <div class="card border-0 shadow-sm">
                <div class="card-body">

                    <h5 class="fw-bold mb-3">Course Lessons</h5>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Lesson Title</th>
                                    <th>Content</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>

                            <tbody>

                                <tr th:each="lesson, stat : ${lessons}">

                                    <td th:text="${stat.count}">01</td>

                                    <td>
                                        <strong th:text="${lesson.title}">
                                            Lesson Title
                                        </strong>

                                        <small class="d-block text-muted"
                                               th:text="${lesson.description}">
                                            Description
                                        </small>
                                    </td>

                                    <td>
                                        <a th:if="${lesson.videoUrl != null and !#strings.isEmpty(lesson.videoUrl)}"
                                           th:href="${lesson.videoUrl}"
                                           target="_blank"
                                           rel="noopener noreferrer">
                                            View Video
                                        </a>

                                        <span th:unless="${lesson.videoUrl != null and !#strings.isEmpty(lesson.videoUrl)}"
                                              class="text-muted">
                                            No Video
                                        </span>
                                    </td>

                                    <td>
                                        <span th:if="${lesson.active}"
                                              class="badge bg-success">
                                            Published
                                        </span>

                                        <span th:unless="${lesson.active}"
                                              class="badge bg-warning text-dark">
                                            Draft
                                        </span>
                                    </td>

                                    <td>
                                        <div class="d-flex gap-2 flex-wrap">

                                            <!-- Publish / Unpublish -->
                                            <form th:action="@{/teacher/lessons/status/{id}(id=${lesson.id})}"
                                                  method="post">

                                                <input type="hidden"
                                                       name="courseId"
                                                       th:value="${selectedCourseId}">

                                                <input type="hidden"
                                                       name="active"
                                                       th:value="${!lesson.active}">

                                                <button type="submit"
                                                        class="btn btn-sm btn-outline-primary"
                                                        th:text="${lesson.active ? 'Unpublish' : 'Publish'}">
                                                    Publish
                                                </button>
                                            </form>

                                            <!-- Edit -->
                                            <a th:href="@{/teacher/lessons/edit/{id}(id=${lesson.id},courseId=${selectedCourseId})}"
                                               class="btn btn-sm btn-outline-primary">
                                                Edit
                                            </a>

                                            <!-- Delete -->
                                            <form th:action="@{/teacher/lessons/delete/{id}(id=${lesson.id})}"
                                                  method="post"
                                                  onsubmit="return confirm('Are you sure you want to delete this lesson?');">

                                                <input type="hidden"
                                                       name="courseId"
                                                       th:value="${selectedCourseId}">

                                                <button type="submit"
                                                        class="btn btn-sm btn-outline-danger">
                                                    Delete
                                                </button>
                                            </form>

                                        </div>
                                    </td>

                                </tr>

                                <!-- Empty State -->
                                <tr th:if="${#lists.isEmpty(lessons)}">
                                    <td colspan="5" class="text-center py-4">
                                        <p class="text-muted mb-0">
                                            No lessons found for this course.
                                        </p>
                                    </td>
                                </tr>

                            </tbody>
                        </table>

                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Add Lesson Modal -->
    <div class="modal fade" id="addLessonModal" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Add New Lesson</h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <form th:action="@{/teacher/lessons/add}"
                          method="post">

                        <div class="mb-3">
                            <label class="form-label">Lesson Title</label>

                            <input type="text"
                                   class="form-control"
                                   name="title"
                                   placeholder="Enter lesson title"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Select Course</label>

                            <select class="form-select"
                                    name="courseId"
                                    required>

                                <option value="">Choose Course</option>

                                <option th:each="course : ${courses}"
                                        th:value="${course.id}"
                                        th:text="${course.title}"
                                        th:selected="${course.id == selectedCourseId}">
                                </option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Lesson Description</label>

                            <textarea class="form-control"
                                      name="description"
                                      rows="3"
                                      placeholder="Enter lesson description"
                                      required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Video URL</label>

                            <input type="url"
                                   class="form-control"
                                   name="videoUrl"
                                   placeholder="Enter video URL">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Lesson Order</label>

                            <input type="number"
                                   class="form-control"
                                   name="lessonOrder"
                                   min="1"
                                   value="1"
                                   required>
                        </div>

                        <div class="modal-footer px-0 pb-0">

                            <button type="button"
                                    class="btn btn-secondary"
                                    data-bs-dismiss="modal">
                                Cancel
                            </button>

                            <button type="submit"
                                    class="btn btn-primary">
                                Save Lesson
                            </button>

                        </div>

                    </form>

                </div>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{common/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
