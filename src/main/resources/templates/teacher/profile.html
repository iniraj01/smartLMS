
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My Profile | SmartLMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{common/navbar :: navbar}"></div>

    <div class="dashboard-wrapper">

        <!-- Common Teacher Sidebar -->
        <div th:replace="~{common/teacher-sidebar :: teacherSidebar('profile')}"></div>

        <!-- Main Content -->
        <main class="main-content">

            <div class="mb-4">
                <h2 class="fw-bold">My Profile</h2>
                <p class="text-muted">
                    View and manage your professional information.
                </p>
            </div>

            <div class="row g-4">

                <!-- Profile Information -->
                <div class="col-lg-4">

                    <div class="card border-0 shadow-sm text-center">

                        <div class="card-body py-5">

                            <div class="mb-3">

                                <div class="rounded-circle bg-primary text-white d-flex justify-content-center align-items-center mx-auto"
                                     style="width:110px;height:110px;font-size:42px;">
                                    RV
                                </div>

                            </div>

                            <h4 class="fw-bold">Rahul Verma</h4>

                            <p class="text-muted mb-2">
                                Java Programming Teacher
                            </p>

                            <span class="badge bg-success">Active Teacher</span>

                            <hr>

                            <p class="text-muted mb-1">Teacher ID</p>
                            <strong>TEA-001</strong>

                            <p class="text-muted mt-3 mb-1">Member Since</p>
                            <strong>January 2026</strong>

                        </div>

                    </div>

                </div>

                <!-- Edit Profile Form -->
                <div class="col-lg-8">

                    <div class="card border-0 shadow-sm">

                        <div class="card-body p-4">

                            <h5 class="fw-bold mb-4">Personal Information</h5>

                            <form>

                                <div class="row g-3">

                                    <div class="col-md-6">

                                        <label class="form-label">Full Name</label>

                                        <input type="text"
                                               class="form-control"
                                               value="Rahul Verma">

                                    </div>

                                    <div class="col-md-6">

                                        <label class="form-label">Email Address</label>

                                        <input type="email"
                                               class="form-control"
                                               value="rahul@gmail.com">

                                    </div>

                                    <div class="col-md-6">

                                        <label class="form-label">Phone Number</label>

                                        <input type="tel"
                                               class="form-control"
                                               value="9876543210">

                                    </div>

                                    <div class="col-md-6">

                                        <label class="form-label">Qualification</label>

                                        <input type="text"
                                               class="form-control"
                                               value="MCA">

                                    </div>

                                    <div class="col-md-6">

                                        <label class="form-label">Specialization</label>

                                        <input type="text"
                                               class="form-control"
                                               value="Java Programming">

                                    </div>

                                    <div class="col-md-6">

                                        <label class="form-label">Experience</label>

                                        <input type="text"
                                               class="form-control"
                                               value="3 Years">

                                    </div>

                                    <div class="col-12">

                                        <label class="form-label">About Me</label>

                                        <textarea class="form-control"
                                                  rows="4">Experienced Java instructor passionate about teaching programming and software development.</textarea>

                                    </div>

                                </div>

                                <button type="button"
                                        class="btn btn-primary mt-4">
                                    Save Profile Changes
                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </main>

    </div>

    <div th:replace="~{common/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
