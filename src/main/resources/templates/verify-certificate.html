
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Certificate Verification | SmartLMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .verification-card {
            max-width: 650px;
            margin: 70px auto;
            border: none;
            border-radius: 15px;
        }

        .verified-icon {
            font-size: 55px;
            color: #198754;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card shadow verification-card">

        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

                <h2 class="fw-bold">SmartLMS</h2>

                <h4>Certificate Verification</h4>

                <p class="text-muted">
                    Verify the authenticity of a SmartLMS certificate.
                </p>

            </div>

            <form th:action="@{/verify-certificate}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Certificate Number
                    </label>

                    <input type="text"
                           name="certificateNumber"
                           class="form-control form-control-lg"
                           placeholder="Enter certificate number"
                           required>

                </div>

                <button type="submit"
                        class="btn btn-primary btn-lg w-100">
                    Verify Certificate
                </button>

            </form>

            <div th:if="${verified == true}"
                 class="alert alert-success mt-4">

                <div class="text-center">

                    <div class="verified-icon">✓</div>

                    <h4 class="fw-bold">
                        Certificate Verified
                    </h4>

                    <p>
                        This certificate exists in the SmartLMS database.
                    </p>

                </div>

                <hr>

                <p>
                    <strong>Certificate Number:</strong>
                    <span th:text="${certificate.certificateNumber}"></span>
                </p>

                <p>
                    <strong>Student Name:</strong>
                    <span th:text="${certificate.student.name}"></span>
                </p>

                <p>
                    <strong>Course:</strong>
                    <span th:text="${certificate.course.title}"></span>
                </p>

                <p>
                    <strong>Issued Date:</strong>
                    <span th:text="${#temporals.format(certificate.issuedAt, 'dd-MM-yyyy')}"></span>
                </p>

            </div>

            <div th:if="${error != null}"
                 class="alert alert-danger mt-4"
                 th:text="${error}">
            </div>

            <div class="text-center mt-4">

                <a th:href="@{/login}"
                   class="text-decoration-none">
                    Back to Login
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
